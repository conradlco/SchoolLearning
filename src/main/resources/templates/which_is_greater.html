<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Which is Greater</title>
  <link rel="stylesheet" th:href="@{/css/words.css}" />
  <style>
    .game-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    .score-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: bold;
    }
    .numbers-display {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin: 40px 0;
    }
    .number-box {
      font-size: 96px;
      font-weight: bold;
      text-align: center;
      padding: 30px;
      border: 3px solid #333;
      border-radius: 10px;
      background: #f9f9f9;
    }
    .answer-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 30px 0;
    }
    .answer-btn {
      font-size: 18px;
      padding: 15px;
      cursor: pointer;
      border: 2px solid #0066cc;
      background: white;
      border-radius: 5px;
      font-weight: bold;
      transition: background 0.3s;
    }
    .answer-btn:hover:not(:disabled) {
      background: #0066cc;
      color: white;
    }
    .answer-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .controls-bottom {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 30px;
    }
    .settings-btn, .close-btn {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: 2px solid #666;
      background: white;
      border-radius: 5px;
    }
    .settings-btn:hover, .close-btn:hover {
      background: #f0f0f0;
    }
    .message {
      text-align: center;
      margin-top: 20px;
      font-size: 18px;
      min-height: 30px;
    }
  </style>
</head>
<body>
<div class="game-container">
  <h1>Which is Greater?</h1>

  <div class="score-row">
    <div>Score: <span id="score">0</span></div>
    <div><span id="counter">0 / 20</span></div>
  </div>

  <div class="numbers-display">
    <div class="number-box" id="leftNumber">-</div>
    <div class="number-box" id="rightNumber">-</div>
  </div>

  <div class="answer-buttons">
    <button class="answer-btn" id="greaterBtn">Left > Right</button>
    <button class="answer-btn" id="equalBtn">Equal</button>
    <button class="answer-btn" id="lessBtn">Left < Right</button>
  </div>

  <div class="message" id="message"></div>

  <div class="controls-bottom">
    <button class="settings-btn" id="settingsBtn">Settings</button>
    <button class="close-btn" id="closeBtn">Close</button>
  </div>
</div>

<script th:src="@{/js/which-is-greater.js}"></script>
</body>
</html>
