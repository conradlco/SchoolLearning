<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>School Exercises</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
            color: #333;
        }
        .exercises-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .exercises-list li {
            margin: 0;
        }
        .exercise-link {
            display: block;
            padding: 20px;
            font-size: 22px;
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg, #0066cc 0%, #004499 100%);
            border: 2px solid #0066cc;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .exercise-link:hover {
            background: linear-gradient(135deg, #004499 0%, #003366 100%);
            border-color: #003366;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        .exercise-link:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>School Exercises</h1>

    <ul class="exercises-list">
        <li><a class="exercise-link" th:href="@{/which-is-greater}">Which is Greater</a></li>
        <li><a class="exercise-link" th:href="@{/words-by-sound}">Words by Sound</a></li>
    </ul>
</div>

</body>
</html>
