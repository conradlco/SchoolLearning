<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Words By Sound</title>
  <link rel="stylesheet" th:href="@{/css/words.css}" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    h1 {
      font-size: 42px;
      margin-bottom: 25px;
      color: #333;
      font-weight: bold;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .controls label {
      font-weight: bold;
      color: #333;
      font-size: 16px;
    }
    .controls select,
    .controls input {
      padding: 10px;
      border: 2px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    .controls select:focus,
    .controls input:focus {
      outline: none;
      border-color: #0066cc;
    }
    #sound {
      font-size: 16px;
      font-weight: 700;
    }
    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 20px;
      font-size: 16px;
      border: 2px solid #0066cc;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
      background: white;
      color: #0066cc;
    }
    .btn:hover:not(:disabled) {
      background: #0066cc;
      color: white;
      box-shadow: 0 4px 8px rgba(0, 102, 204, 0.3);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      color: #999;
      border-color: #999;
    }
    .close-btn {
      padding: 10px 20px;
      font-size: 16px;
      border: 2px solid #666;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      background: white;
      color: #666;
      transition: all 0.3s ease;
    }
    .close-btn:hover {
      background: #666;
      color: white;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    #info {
      margin: 12px 0;
      color: #d9534f;
      font-size: 16px;
      min-height: 20px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 20px;
    }
    .cell {
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wordBtn {
      width: 100%;
      padding: 8px 10px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 5px;
      cursor: pointer;
      background: white;
      color: #333;
      transition: all 0.3s ease;
      font-weight: 500;
    }
    .wordBtn:hover {
      background: #e8f4f8;
      border-color: #0066cc;
      color: #0066cc;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Words By Sound</h1>
  <div class="controls">
    <label for="level">Level:</label>
    <select id="level"></select>
    <label for="sound">Sound of the Week:</label>
    <input id="sound" type="text" />
    <div class="button-group">
      <button class="btn" id="show" disabled>Show</button>
      <button class="close-btn" id="close">Close</button>
    </div>
  </div>

  <div id="info" class="info"></div>

  <div id="results" class="grid"></div>
</div>
<script th:src="@{/js/words-by-sound.js}"></script>
</body>
</html>
